<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPCR | Acceso al Sistema</title>
    <link rel="stylesheet" href="./css/main.css">
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">
    <main class="login-container">
        <div class="login-card">
            <h1>SPCR 💧⚡</h1>
            <p>Sistema de Seguimiento de Consumo de Recursos</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="nombreHogar">Nombre de la Familia / Hogar:</label>
                    <input type="text" id="nombreHogar" placeholder="Ej. Familia Sánchez" required>
                </div>
                <button type="submit" class="btn-primary">Ingresar al Sistema</button>
            </form>
        </div>
    </main>

    <!-- Scripts -->
    <script src="./js/supabase.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
